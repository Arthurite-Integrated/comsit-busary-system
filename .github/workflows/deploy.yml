name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest code and reload Apache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.60.39.136
          username: admin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            sudo git pull
            sudo systemctl reload apache2
